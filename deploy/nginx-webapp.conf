# Конфігурація Nginx для Telegram Mini App Freelance AI Helper
#
# Як налаштувати на VPS (Ubuntu):
# 1. Спрямуйте ваш домен (A-запис) на IP VPS: 152.70.19.219
# 2. Скопіюйте цей файл:
#    sudo cp deploy/nginx-webapp.conf /etc/nginx/sites-available/freelance-webapp.conf
# 3. Відредагуйте домен:
#    sudo nano /etc/nginx/sites-available/freelance-webapp.conf
# 4. Активуйте сайт:
#    sudo ln -s /etc/nginx/sites-available/freelance-webapp.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 5. Отримайте безкоштовний HTTPS-сертифікат від Let's Encrypt:
#    sudo certbot --nginx -d your-domain.com
# 6. Увімкніть Mini App у @BotFather командою /setmenubutton з URL https://your-domain.com

server {
    listen 80;
    server_name freelans.duckdns.org your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
